# yaml-language-server: $schema=https://raw.githubusercontent.com/rin00159/directory-jsonschema/refs/heads/main/schema/0.0.0/directory.schema.st.json
contents:
  - type: file
    name: ripotask.json
    description: リポジトリ開発状況の管理
  - type: file
    name: package.json
    description: パッケージ情報
    data:
      format: json
      containsProperties: {
        "$schema": "/Users/rin/mydev/schema/ripo-schema/src/schema/withRipoLinks/package.schema.json",
      }
  - type: file
    name: README.md
    description: 利用者向けの説明用文書。`file:./schema/unischema.yaml`のschemaに対応するjson を元に生成する。自動生成も可能。
    detail: |
      詳細:実リポジトリにおける主に`./package.json`と`./package.cdx.json`と`./codemeta.json` を情報源に生成する想定。
      理由:README.md を真に情報源にするのは望ましくない。
      補足:[整合性のための定義](../../docs/package.md)
  - type: file
    name: LICENSE
    description: ライセンス情報
  - type: file
    name: .gitignore
    description: git設定の一部
  - type: directory
    name: src
    description: 配置:ソースコードなど(パッケージ内で利用する静的アセット)

items:
  oneOf:
    - type: file
      name: package.cdx.json
      description: パッケージ情報(package.json の構造化と補足)
      data:
        format: json
        containsProperties: {
          "$schema": "/Users/rin/mydev/schema/ripo-schema/src/schema/package.cdx.schema.json"
        }
    - type: file
      name: codemeta.json
      #fix 具体的にサポートするプロパティを決めてない。
      description: 学術利用のための補足情報
      data:
        format: json
        containsProperties: {
          "$schema": "/Users/rin/mydev/schema/ripo-schema/src/schema/codemeta.schema.json"
        }
    - type: directory
      name: dist
      description: 配置:コンパイル成果物
    - type: directory
      name: docs
      description: 配置:documents
    - type: directory
      name: node_modules
      description: 配置:依存ライブラリのコード
    - type: directory
      name: examples
      description: 配置:例示。テストに使われたり、検証の対象に入る場合もある。
    - type: directory
      name: tests
      description: 配置:テストコード
    - type: file
      name: DIRDESC.yaml
      description: ディレクトリ構造説明
      data:
        format: json
        containsProperties: {
          "$schema": "https://raw.githubusercontent.com/rin00159/directory-jsonschema/refs/heads/main/schema/0.0.0/directory.schema.st.json"
        }