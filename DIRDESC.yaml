# yaml-language-server: $schema=https://raw.githubusercontent.com/rin00159/directory-jsonschema/refs/heads/main/schema/0.0.0/directory.schema.st.json
contents:
  - type: directory
    name: docs
  - type: directory
    name: examples
    description: これら example-json.json は作成が必須ではないが作るのが望ましい
    opContents:
      - type: directory
        name:
          pattern: ^d+$
        description: nameは対象の major-version
        opContents:
          - type: directory
            name:
              pattern: ^d+$
            description: nameは対象の minor-version
            opContents:
              - type: file
                name: 
                  pattern: "^(?<SubexT>[^._]+)(?:_defs-(?<DeF>[^.]+))?\\.json-examples\\.json$"
                description: |
                  SubexT.json or NamE.SubexT.json//例:unischema.json
                  とする時の命名パターン。
                  SubexT:jsonファイルとしての拡張子,DeF:参照するJSONSchemaの$defs
  - type: directory
    name: src
    contents:
      - type: file
        name: DIRDESC.define.yaml
        description: "`ripo-schema`リポジトリが制約する、プロジェクトのディレクトリ構造"
  - type: directory
    name: schema
    contents:
      - type: directory
        name: vendor
        description: ベンダーからinstallしたままのschema定義
      - type: directory
        name: 
          pattern: "^(?<major>\\d+),(?<minor>\\d+),(?<patch>\\d+)$"
        description: 基本的に 0.0.0 が始まり。0.0.0 -> 0.0.0 は破壊的変更が許される
        contents:
          - type: directory
            name: withRipoLinks
            contents:
              - type: file
                name: package.schema.json
                description: ../package.schema.json からさらにリポジトリ等へのリンクを必須化 
          - type: file
            name: unischema.yaml
            description: ディレクトリスキーマで利用される`JSONSchemaのunischema定義`
          - type: file
            name: codemeta.schema.json
            description: ディレクトリスキーマで利用される`CodeMeta`のJSONSchema
          - type: file
            name: package.cdx.schema.json
            description: ディレクトリスキーマで利用される`CycloneDX 1.6`のJSONSchema
          - type: file
            name: package.schema.json
            description: ディレクトリスキーマで利用される`package.json`のJSONSchema。特定のプロパティを必須に資する目的で設定