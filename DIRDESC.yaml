# yaml-language-server: $schema=https://raw.githubusercontent.com/rin00159/directory-jsonschema/refs/heads/main/schema/0.0.0/directory.schema.st.json
contents:
  - type: directory
    name: docs
  - type: directory
    name: examples
    description: これら example-json.json は作成が必須ではないが作るのが望ましい
  - type: directory
    name: src
    contents:
      - type: file
        name: DIRDESC.define.yaml
        description: "リポジトリが制約する、プロジェクトのディレクトリ構造"
  - type: directory
    name: schema
    contents:
      - type: directory
        name: vendor
        description: ベンダーからinstallしたままのschema定義
      - type: directory
        name: 
          pattern: "^(?<major>\\d+),(?<minor>\\d+),(?<patch>\\d+)$"
        contents:
          - type: directory
            name: withRipoLinks
            contents:
              - type: file
                name: package.schema.json
                description: ../package.schema.json からさらにリポジトリ等へのリンクを必須化 
          - type: file
            name: unischema.yaml
            description: ディレクトリスキーマで利用される`JSONSchemaのunischema定義`
          - type: file
            name: codemeta.schema.json
            description: ディレクトリスキーマで利用される`CodeMeta`のJSONSchema
          - type: file
            name: package.cdx.schema.json
            description: ディレクトリスキーマで利用される`CycloneDX 1.6`のJSONSchema
          - type: file
            name: package.schema.json
            description: ディレクトリスキーマで利用される`package.json`のJSONSchema。特定のプロパティを必須に資する目的で設定